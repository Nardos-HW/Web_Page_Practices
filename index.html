<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body {
      background-color: rgb(189, 219, 230);
      font-style: arial;
    }


    .div {
      background-color: white;
      padding: 8px;
      margin: auto;
      margin-top: 200px;
      width: 200px;
      border-radius: 8px;
    }

    img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      margin-bottom: 10px;
      border-radius: 8px;

    }

    .improve {
      font-weight: bold;
      font-size: 15px;
      margin: 0 6px;
      text-align: center;
    }

    .scan {
      color: gray;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="div">
    <img src="image-qr-code.png" alt="image-qr-code">
    <p class="improve">
      Improve your front-end skills by building projects
    </p>
    <p class="scan">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level
    </p>

  </div>

</body>

</html>
